services:
  postgres:
    image: postgres:16-alpine
    container_name: railcat_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - railcat_postgres_data:/var/lib/postgresql/data
      - ./schemas/init-all-databases.sql:/docker-entrypoint-initdb.d/01-init-all-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  railcat_postgres_data:
    driver: local
